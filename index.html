<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EdgeWatch - Trazabilidad, alertas y diagnóstico en tiempo real para procesos de recubrimiento HVOF">
  <title>EdgeWatch | Trazabilidad y Diagnóstico para Procesos HVOF</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body id="top">

  <!-- ==================== Site Header / Navbar ==================== -->
  <header class="site-header">
    <div class="container navbar">
      <a href="#top" class="brand-logo" aria-label="EdgeWatch Home">
        <img src="assets/logo.png" height="24" alt="EdgeWatch Logo" class="brand-logo-img">
      </a>

      <!-- Mobile Navigation Toggle -->
      <button class="mobile-toggle" aria-label="Abrir menú" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <!-- Main Navigation Menu -->
      <nav class="nav-menu">
        <a href="#solucion" class="nav-link">Producto</a>
        <a href="#como-funciona" class="nav-link">Cómo funciona</a>
        <a href="#planes" class="nav-link">Planes</a>
        <a href="#testimonios" class="nav-link">Nosotros</a>
      </nav>

      <!-- Action Button -->
      <div class="nav-actions">
        <button class="btn btn-outline" data-open-demo>Solicitar demo</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ==================== Hero Section ==================== -->
    <section class="hero-section">
      <div class="hero-bg-accent" aria-hidden="true"></div>
      <div class="container hero-grid">
        <div class="hero-content">
          <h1 class="hero-title">Deje de perseguir el dato que su propio equipo ya genera</h1>
          <p class="hero-subtitle">Trazabilidad, alertas y diagnóstico en tiempo real para procesos de recubrimiento HVOF</p>
          <div class="hero-buttons">
            <button class="btn btn-primary" data-open-demo>Solicitar demo</button>
            <a href="#como-funciona" class="btn btn-ghost">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              Ver cómo funciona
            </a>
          </div>
        </div>

        <div class="hero-visual">
          <div class="hero-phone-container">
            <img src="assets/hero-phone.png" alt="EdgeWatch Aplicación Móvil de Integraciones" class="hero-phone-img">
          </div>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
